[project]
name = "startup_intellisense"
version = "0.1.0"
description = "A tiny YC startup pipeline with Postgres, Playwright, Groq, Qdrant, and Streamlit."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "streamlit>=1.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "groq>=0.26",
    "sentence-transformers>=3.0",
    "asyncpg>=0.31.0",  # Asynchronous database interface library specifically designed for Python's asyncio framework and PostgreSQL.
    "tenacity>=9.1.4",  # General purpose automatic retry-logic library for functions
    "playwright>=1.60.0",
    "chromium>=0.0.0",
    "hdbscan>=0.8.44",
    "umap-learn>=0.5.12",
    "plotly>=6.8.0",
    "dotenv>=0.9.9",
    "pycountry>=26.2.16",
]