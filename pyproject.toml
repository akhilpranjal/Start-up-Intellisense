[project]
name = "startup-intellisense"
version = "0.1.0"
description = "A tiny YC startup pipeline with Postgres, Crawl4AI, Groq, Qdrant, HDBSCAN, and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "psycopg[binary]>=3.2",
    "qdrant-client>=1.9",
    "hdbscan>=0.8.40",
    "streamlit>=1.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "groq>=0.26",
    "crawl4ai",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
]

[tool.setuptools]
packages = ["app", "scrapers"]
