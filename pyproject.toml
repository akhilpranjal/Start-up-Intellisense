[project]
name = "startup-intellisense"
version = "0.1.0"
description = "A tiny YC startup pipeline with Postgres, Playwright, Groq, Qdrant, and Streamlit."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-dotenv>=1.0",
    "qdrant-client>=1.9",
    "streamlit>=1.36",
    "pandas>=2.2",
    "numpy>=1.26",
    "groq>=0.26",
    "beautifulsoup4>=4.12",
    "sentence-transformers>=3.0",
    "torchvision>=0.27.0",
    "torch>=2.12.0",
    "asyncpg>=0.31.0",
]

[tool.setuptools]
packages = ["app", "scrapers"]
