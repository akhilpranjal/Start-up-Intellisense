name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:24.0.6
        options: --privileged
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Start Redis and Qdrant via Docker Compose
        run: |
          docker-compose up -d redis qdrant

      - name: Start API
        run: |
          nohup uvicorn app.api:app --host 0.0.0.0 --port 8000 &
          sleep 3

      - name: Run smoke tests
        run: |
          python -m pip install requests
          python tests/smoke_test.py || true
          python tests/smoke_test_search.py || true